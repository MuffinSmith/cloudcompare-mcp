name: Resume overlay safety validation

# One-shot exact-patch transport from the disconnected development container.
# The applying commit removes this file. Never updates main or force-pushes.
on:
  push:
    branches: [feature/live-feature-candidates-overlays]
    paths: [.github/workflows/resume-overlay-safety.yml]
permissions:
  contents: read
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tested_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply locally tested patch with exact content guards
        env:
          PATCH_B64: >-
            
        run: |
          python - <<'PY'
          import base64, hashlib, os, pathlib, subprocess, zlib
          source = 'cloudcompare-plugin/qMCPBridge/src/qMCPFusionWorkflow.cpp'
          expected_base = '02695d9bb647109f714538cbbb349719b0f682ee'
          assert subprocess.check_output(['git', 'hash-object', source], text=True).strip() == expected_base
          patch = zlib.decompress(base64.b64decode(os.environ['PATCH_B64']))
          assert hashlib.sha256(patch).hexdigest() == 'bdecaef942ce372b0f97368c7ebfd36cfaa7ddf32cbebb10120e90d7feee02cb'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'overlay-safety.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--index', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          assert subprocess.check_output(['git', 'hash-object', source], text=True).strip() == '68c76a903c41828b74a4256fdb3796ef4449be45'
          PY
      - run: pip install -e '.[test]'
      - run: python -m compileall -q src scripts tests
      - run: pytest -q tests | tee "$RUNNER_TEMP/full-pytest.txt"
      - name: Commit only guarded source change and remove this one-shot workflow
        id: commit
        run: |
          test "$(git ls-remote origin refs/heads/feature/live-feature-candidates-overlays | cut -f1)" = "$GITHUB_SHA"
          git rm .github/workflows/resume-overlay-safety.yml
          git diff --cached --check
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git commit -m 'Guard native overlay ownership and coordinate range (refs #7)'
          git push origin HEAD:refs/heads/feature/live-feature-candidates-overlays
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Export exact tested source and real SDK wheels for offline validation
        run: |
          mkdir -p "$RUNNER_TEMP/replay/wheels"
          git archive --format=tar --output="$RUNNER_TEMP/replay/cloudcompare-source.tar" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/replay/COMMIT.txt"
          cp "$RUNNER_TEMP/full-pytest.txt" "$RUNNER_TEMP/replay/"
          python - <<'PY'
          import importlib.metadata, os, subprocess
          names = ['mcp', 'sse-starlette', 'httpx-sse', 'laspy', 'plyfile']
          requirements = [name + '==' + importlib.metadata.version(name) for name in names]
          subprocess.run(['python', '-m', 'pip', 'download', '--no-deps', '--only-binary=:all:', '--dest', os.environ['RUNNER_TEMP'] + '/replay/wheels', *requirements], check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: overlay-safety-offline-replay
          path: ${{ runner.temp }}/replay/
          retention-days: 3
  native-linux:
    needs: apply-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply-and-test.outputs.tested_sha }}
      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qtbase5-dev qttools5-dev libqt5opengl5-dev libqt5svg5-dev libeigen3-dev
      - name: Configure exact CloudCompare 2.13.2 host source
        run: |
          git clone --depth 1 --branch v2.13.2 https://github.com/CloudCompare/CloudCompare.git "$RUNNER_TEMP/CloudCompare"
          test "$(git -C "$RUNNER_TEMP/CloudCompare" rev-parse HEAD)" = 49dbbb662f296c7780aae717897c85b3cb3764ed
          git -C "$RUNNER_TEMP/CloudCompare" submodule update --init --recursive libs/qCC_db/extern/CCCoreLib
          cp -R cloudcompare-plugin/qMCPBridge "$RUNNER_TEMP/CloudCompare/plugins/core/Standard/"
          printf '\nadd_subdirectory( qMCPBridge )\n' >> "$RUNNER_TEMP/CloudCompare/plugins/core/Standard/CMakeLists.txt"
          cmake -S "$RUNNER_TEMP/CloudCompare" -B "$RUNNER_TEMP/cc-build" -DCMAKE_BUILD_TYPE=Release -DOPTION_BUILD_CCVIEWER=OFF -DPLUGIN_STANDARD_QMCP_BRIDGE=ON
      - name: Compile actual plugin against actual CloudCompare SDK
        run: cmake --build "$RUNNER_TEMP/cc-build" --target QMCP_BRIDGE_PLUGIN --parallel 2
