name: temporary offline test dependencies
on:
  push:
    branches: [feature/live-cad-section-target-roi]
    paths: [.github/workflows/offline-test-dependencies.yml]
permissions:
  contents: read
jobs:
  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download public dependency wheels only
        run: |
          python -m pip download --only-binary=:all: --dest wheelhouse 'mcp[cli]>=1.30.0,<2' hatchling 'laspy[lazrs]>=2.5' 'plyfile>=0.9'
      - uses: actions/upload-artifact@v4
        with:
          name: offline-python313-public-wheels
          path: wheelhouse
          retention-days: 1
          if-no-files-found: error
