name: apply visual checkpoint
on:
  push:
    branches: [feature/live-agent-visual-inspection]
    paths: [.github/checkpoints/apply.py, .github/workflows/apply-visual-checkpoint.yml]
permissions:
  contents: write
  actions: write
jobs:
  apply:
    if: github.repository == 'MuffinSmith/cloudcompare-mcp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: false
      - name: Apply exact source edits; workflow edits use the authorized connector
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          branch=feature/live-agent-visual-inspection
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path
          code=Path('.github/checkpoints/apply.py').read_text()
          exec(code.split("p=r/'.github/workflows/tests.yml';")[0])
          p=Path('AGENTS.md');s=p.read_text()
          s=s.replace('Native integration is pending the narrow checkpoint helper.', 'Native integration is applied. qMCPBridge 0.13.0 / revision 9 camera and camera-bound capture are wired in. Actual CloudCompare 2.13.2 native compilation and installed regression CI have been requested; inspect real results. The transport workflow still needs removal through the connector (Actions tokens cannot edit workflows).')
          p.write_text(s)
          PY
          git diff --check
          git add -u
          git rm .github/checkpoints/apply.py
          git -c user.name='CloudCompare checkpoint' -c user.email='checkpoint@users.noreply.github.com' commit -m 'Integrate recoverable native camera contract and capture provenance'
          git push origin HEAD:refs/heads/$branch
          gh api --method POST repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/dispatches -f ref=$branch
