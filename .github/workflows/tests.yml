name: tests

on:
  push:
    branches:
      - feature/fusion-reference-mesh-workflow
      - feature/live-scan-preparation
      - feature/live-registration
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - run: python -m compileall -q src scripts tests
      - run: pytest -q tests
