name: tests

on:
  push:
    branches:
      - feature/fusion-reference-mesh-workflow
      - feature/live-scan-preparation
      - feature/live-registration
      - feature/live-registration-analysis
      - feature/live-metrology
      - feature/live-feature-fitting
      - feature/live-cylinder-sections
      - feature/live-region-fitting
      - feature/live-feature-discovery
      - feature/live-feature-candidates-overlays
      - feature/live-hole-patterns
      - feature/live-cad-datum-relationships
      - feature/live-cad-profile-reconstruction
      - feature/live-cad-profile-topology
      - feature/live-cad-section-boundary-extraction
      - feature/live-cad-section-layer-isolation
      - feature/live-cad-section-target-isolation
      - main
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - run: python -m compileall -q src scripts tests
      - run: git diff --check
      - run: python -m pytest -q tests
      # Only tracked public source is archived. Do not include the workspace,
      # credentials, local evidence, or the user's fan_project.bin fixture.
      - name: Archive exact tested source
        if: always()
        run: git archive --format=tar --output=cloudcompare-source.tar HEAD
      - name: Publish source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tested-source-${{ github.sha }}
          path: cloudcompare-source.tar
          if-no-files-found: error
          retention-days: 3
