name: tests

on:
  push:
    branches: [feature/live-cad-datum-relationships]

# Temporary exact-source handoff for a network-isolated development container.
# The final product tree restores the normal read-only test workflow.
# This job creates only unreferenced Git blobs: it never updates a ref or merges.
permissions:
  contents: write

jobs:
  python:
    if: github.repository == 'MuffinSmith/cloudcompare-mcp' && github.ref == 'refs/heads/feature/live-cad-datum-relationships'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Recover and verify exact locally tested source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          baseline = 'e39949759c6386e5cd0387983c43a74f26e6a58e'
          desired = 'b2d7ce70adf6113316294eef751dfc8f0a82e2bf'
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          assert git('rev-parse', 'HEAD^') == baseline
          assert git('diff', '--name-only', baseline, 'HEAD') == '.github/workflows/tests.yml'
          assert not git('status', '--porcelain')
          shas = ['59b7581a0afb4dd6bccb7d5641e9362a76f6ae5a',
                  '85ce90e77130eb5e4b42e5246cabb24697693d2e',
                  '38c69e73442901d65222591c5efd0f3bc611d1ef',
                  '1c4db8c6ed2e72150b44f9283d5f31e8cadc8b9c',
                  '5c3f747a7e8a73446ee96bfbf6e9a06514b33482',
                  '79a38f8842b6085773105bdc3926eb698e97c178']
          chunks = []
          for sha in shas:
              result = json.loads(subprocess.check_output(['gh', 'api', 'repos/MuffinSmith/cloudcompare-mcp/git/blobs/' + sha]))
              data = base64.b64decode(result['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              chunks.append(data)
          patch = lzma.decompress(base64.b64decode(b''.join(chunks)))
          assert len(patch) == 88333
          assert hashlib.sha256(patch).hexdigest() == 'b6dfd53b062de71b30503a84103c264cfaf857ee584433db5922a4b37e3e023d'
          pathlib.Path('.github/workflows/tests.yml').write_bytes(subprocess.check_output(['git', 'show', baseline + ':.github/workflows/tests.yml']))
          subprocess.run(['git', 'apply', '--check'], input=patch, check=True)
          subprocess.run(['git', 'apply'], input=patch, check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          assert git('write-tree') == desired
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--exit-code', baseline, '--', 'cloudcompare-plugin'], check=True)
          print('Verified exact product tree:', desired)
          PY
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q src scripts tests
      - run: pytest -q tests
      - name: Store tested source blobs without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          baseline = 'e39949759c6386e5cd0387983c43a74f26e6a58e'
          desired = 'b2d7ce70adf6113316294eef751dfc8f0a82e2bf'
          assert subprocess.check_output(['git', 'write-tree']).decode().strip() == desired
          names = subprocess.check_output(['git', 'diff', '--cached', '--name-only', baseline]).decode().splitlines()
          assert len(names) == 14
          entries = []
          for name in names:
              data = pathlib.Path(name).read_bytes()
              expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              payload = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode()
              result = json.loads(subprocess.check_output(['gh', 'api', '--method', 'POST', 'repos/MuffinSmith/cloudcompare-mcp/git/blobs', '--input', '-'], input=payload))
              assert result['sha'] == expected
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': expected})
          output = {'baseline': baseline, 'handoff_commit': os.environ['GITHUB_SHA'], 'tested_product_tree': desired, 'entries': entries}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'datum-product-descriptor.json').write_text(json.dumps(output, indent=2))
          print(json.dumps(output, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: datum-product-descriptor
          path: ${{ runner.temp }}/datum-product-descriptor.json
          if-no-files-found: error
          retention-days: 3
      - name: Collect real SDK wheels for offline exact-source testing
        if: always()
        run: python -m pip download --dest '${{ runner.temp }}/cc-wheelhouse' 'mcp[cli]>=1.30.0,<2' hatchling 'laspy[lazrs]>=2.5' 'plyfile>=0.9' 'pytest>=8'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cc-python313-wheelhouse
          path: ${{ runner.temp }}/cc-wheelhouse/
          if-no-files-found: error
          retention-days: 3
