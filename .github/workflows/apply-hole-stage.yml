name: Apply and validate hole pattern stage

# One-shot exact-patch transport for the disconnected development container.
# This workflow and its encoded patch are removed by the tested commit.
on:
  push:
    branches: [feature/live-hole-patterns]
    paths: [.github/workflows/apply-hole-stage.yml]
permissions:
  contents: read
jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact locally tested source with commit and tree guards
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 38f92c1dd62fdba92a4fc51959289287ae6eaaed
          python - <<'PY'
          import base64, hashlib, os, pathlib, subprocess, zlib
          folder = pathlib.Path('.github/hole-stage-transport')
          encoded = b''.join((folder / f'part{i}.b64').read_bytes() for i in range(3))
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '9bca98f72a715c22acb4afa3049f95cce7c258c4f345edcfa4112cb06e81f210'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'hole-stage.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--index', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          PY
          git rm .github/workflows/apply-hole-stage.yml .github/hole-stage-transport/part0.b64 .github/hole-stage-transport/part1.b64 .github/hole-stage-transport/part2.b64
          test "$(git write-tree)" = 76e0f361d292e889094747e3866c8b87969dd8f8
          git diff --cached --check
          git diff --exit-code 38f92c1dd62fdba92a4fc51959289287ae6eaaed -- cloudcompare-plugin
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q src scripts tests
      - name: Run complete exact-source regression suite
        run: |
          set -euo pipefail
          python -m pytest -q tests | tee "$RUNNER_TEMP/hole-pytest.log"
      - name: Publish tested source without overwriting concurrent work
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feature/live-hole-patterns | cut -f1)" = "$GITHUB_SHA"
          test "$(git write-tree)" = 76e0f361d292e889094747e3866c8b87969dd8f8
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git commit -m 'Add face-constrained hole candidate grouping and spacing analysis'
          git push origin HEAD:refs/heads/feature/live-hole-patterns
          mkdir -p "$RUNNER_TEMP/hole-stage-replay"
          git rev-parse HEAD > "$RUNNER_TEMP/hole-stage-replay/COMMIT.txt"
          git archive --format=tar --output="$RUNNER_TEMP/hole-stage-replay/cloudcompare-source.tar" HEAD
          cp "$RUNNER_TEMP/hole-pytest.log" "$RUNNER_TEMP/hole-stage-replay/"
      - uses: actions/upload-artifact@v4
        with:
          name: hole-pattern-stage-tested-source
          path: ${{ runner.temp }}/hole-stage-replay/
          retention-days: 3
          if-no-files-found: error
