name: intent offline bootstrap
on:
  push:
    branches: [feature/live-section-roi-from-picks]
    paths: [.github/workflows/intent-offline-bootstrap.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download public test dependencies only
        run: >-
          python -m pip download --only-binary=:all: --dest wheels
          'mcp[cli]>=1.30.0,<2' 'laspy[lazrs]>=2.5' 'plyfile>=0.9' hatchling
      - uses: actions/upload-artifact@v4
        with:
          name: intent-offline-python313
          path: wheels/*.whl
          retention-days: 1
